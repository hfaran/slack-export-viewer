name: PR title

# Squash merges use the PR title as the commit subject, and scripts/release.py reads
# those subjects when it picks the next version:
#   feat: -> minor, fix:/perf: -> patch, any type with "!" (e.g. feat!:) -> major.

on:
  # pull_request, not pull_request_target: fork PRs get a read-only token, which is all
  # this check needs. synchronize re-runs it on each push so the latest commit has it.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with TYPE_LEVELS and OTHER_TYPES in scripts/release.py.
          types: |
            feat
            fix
            perf
            build
            chore
            ci
            docs
            refactor
            revert
            style
            test
