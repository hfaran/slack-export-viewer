[tool.poetry]
name = "slack-export-viewer"
version = "4.0.2"
description = "Slack Export Archive Viewer"
authors = ["hfaran"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hfaran/slack-export-viewer"
repository = "https://github.com/hfaran/slack-export-viewer"
packages = [{include = "slackviewer"}]

[tool.poetry.dependencies]
python = ">=3.12,<4"
click = "*"
Werkzeug = ">=3.1.9"
Flask = ">=3.1.3"
markdown2 = ">=2.4.0"
emoji = ">=2.0.0,<3.0"
frozen-flask = ">=1.0.1"
Jinja2 = ">=3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.scripts]
slack-export-viewer = "slackviewer.main:main"
slack-export-viewer-cli = "slackviewer.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
